<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Team Organization Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background so slides pop */
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        /* 
         * Slide Container 
         * Fixed 16:9 aspect ratio (1280x720) to perfectly mimic a presentation slide 
         */
        .slide {
            position: relative;
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            overflow: hidden;
        }

        .slide-title {
            position: absolute;
            top: 40px;
            left: 50px;
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
        }

        /* SVG Container for Connecting Lines */
        .lines-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .org-line {
            stroke: #1f2937; /* Dark gray/black lines */
            stroke-width: 4px;
            fill: none;
            stroke-linecap: square;
        }

        /* Individual Org Node Styling */
        .org-node {
            position: absolute;
            z-index: 10;
            width: 320px;
            height: 100px;
            background-color: #0070c0; /* Exact vibrant blue from your screenshot */
            border-radius: 4px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .node-image-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e5e7eb;
            border: 4px solid #fff;
            position: absolute;
            left: -30px; /* Overlap on the left edge */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .node-image-container svg {
             width: 60%;
             height: 60%;
             color: #9ca3af;
        }

        /* Added styling for the new profile images */
        .node-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .node-content {
            margin-left: 80px;
            padding: 0 16px;
            color: white;
            text-align: left;
        }

        .node-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .node-title {
            font-size: 13px;
            opacity: 0.95;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- SLIDE 1: LDOG TEAM                         -->
    <!-- ========================================== -->
    <div class="slide">
        <div class="slide-title">Legal Dev, Ops, & Governance Team</div>
        
        <svg class="lines-container">
            <!-- Andrea to Kayla & Morgan split -->
            <path class="org-line" d="M 440 280 L 440 350" />
            <!-- Horizontal split to Kayla (left) and Morgan (right) -->
            <path class="org-line" d="M 260 350 L 620 350" />
            <path class="org-line" d="M 260 350 L 260 420" />
            <path class="org-line" d="M 620 350 L 620 420" />
        </svg>

        <!-- Level 1: Andrea & Jack -->
        <div class="org-node" style="left: 280px; top: 180px;">
            <div class="node-image-container">
                <img src="andrea%20icon.png" alt="Andrea Nocito">
            </div>
            <div class="node-content">
                <div class="node-name">Andrea Nocito</div>
                <div class="node-title">Counsel</div>
            </div>
        </div>

        <div class="org-node" style="left: 680px; top: 180px;">
            <div class="node-image-container">
                <img src="jack%20icon.png" alt="Jack Semrani">
            </div>
            <div class="node-content">
                <div class="node-name">Jack Semrani</div>
                <div class="node-title">Counsel</div>
            </div>
        </div>

        <!-- Level 2: Kayla & Morgan (Reporting to Andrea) -->
        <div class="org-node" style="left: 100px; top: 420px;">
            <div class="node-image-container">
                <img src="kayla%20icon.jpg" alt="Kayla Risovi">
            </div>
            <div class="node-content">
                <div class="node-name">Kayla Risovi</div>
                <div class="node-title">Senior Paralegal</div>
            </div>
        </div>

        <div class="org-node" style="left: 460px; top: 420px;">
            <div class="node-image-container">
                <img src="morgan%20icon.png" alt="Morgan Byrne">
            </div>
            <div class="node-content">
                <div class="node-name">Morgan Byrne</div>
                <div class="node-title">Paralegal</div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SLIDE 2: TRANSACTIONAL LEGAL TEAM          -->
    <!-- ========================================== -->
    <div class="slide">
        <div class="slide-title">Transactional Legal Team</div>
        
        <svg class="lines-container">
            <!-- Rachel's central spine down to bottom levels -->
            <path class="org-line" d="M 640 180 L 640 430" />
            
            <!-- Level 2 branches (Osama & Sam) -->
            <path class="org-line" d="M 360 230 L 920 230" />
            <path class="org-line" d="M 360 230 L 360 280" />
            <path class="org-line" d="M 920 230 L 920 280" />
            
            <!-- Level 3 branches (Selima & Angelina) -->
            <path class="org-line" d="M 360 430 L 920 430" />
            <path class="org-line" d="M 360 430 L 360 480" />
            <path class="org-line" d="M 920 430 L 920 480" />
        </svg>

        <!-- Level 1: Rachel -->
        <div class="org-node" style="left: 480px; top: 80px;">
            <div class="node-image-container">
                <img src="rachel%20icon.png" alt="Rachel Monita">
            </div>
            <div class="node-content">
                <div class="node-name">Rachel Monita</div>
                <div class="node-title">Oversees Transactional Legal</div>
            </div>
        </div>

        <!-- Level 2: Osama & Sam (Reporting to Rachel) -->
        <div class="org-node" style="left: 200px; top: 280px;">
            <div class="node-image-container">
                <img src="osama%20icon.jpg" alt="Osama Khan">
            </div>
            <div class="node-content">
                <div class="node-name">Osama Khan</div>
                <div class="node-title">Counsel</div>
            </div>
        </div>

        <div class="org-node" style="left: 760px; top: 280px;">
            <div class="node-image-container">
                <img src="sam%20icon.jpg" alt="Sam Hawe">
            </div>
            <div class="node-content">
                <div class="node-name">Sam Hawe</div>
                <div class="node-title">Counsel</div>
            </div>
        </div>

        <!-- Level 3: Selima -->
        <div class="org-node" style="left: 200px; top: 480px;">
            <div class="node-image-container">
                <img src="selima%20icon.png" alt="Selima Serna">
            </div>
            <div class="node-content">
                <div class="node-name">Selima Serna</div>
                <div class="node-title">Paralegal</div>
            </div>
        </div>
        <!-- Level 3: Angelina -->
        <div class="org-node" style="left: 760px; top: 480px;">
            <div class="node-image-container">
                <img src="angelina%20icon.jpg" alt="Angelina Radden">
            </div>
            <div class="node-content">
                <div class="node-name">Angelina Radden</div>
                <div class="node-title">Paralegal</div>
            </div>
        </div>
    </div>

</body>
</html>
